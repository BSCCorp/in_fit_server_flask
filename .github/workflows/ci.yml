name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        run: mypy

      - name: Run tests
        run: |
          pytest \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Build Docker image
        run: |
          docker build \
            --tag flask-infit-api:test \
            .

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name flask-infit-api-test \
            -p 127.0.0.1:18000:8000 \
            flask-infit-api:test

          cleanup() {
            docker logs flask-infit-api-test || true
            docker rm -f flask-infit-api-test >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:18000/health/live; then
              echo
              exit 0
            fi

            sleep 2
          done

          echo "Container failed its health check."
          exit 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: publish

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/flask-infit-api/docker-compose.prod.yml"

          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            deploy/deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/flask-infit-api/deploy.sh"

      - name: Deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="ghcr.io/${REPOSITORY,,}:${IMAGE_SHA}"

          echo "Deploying image: $IMAGE_REF"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash /opt/flask-infit-api/deploy.sh '$IMAGE_REF'"


