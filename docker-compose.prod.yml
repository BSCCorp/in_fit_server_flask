services:
  api:
    image: ${IMAGE_REF:?IMAGE_REF must be set}

    container_name: flask-api

    restart: unless-stopped

    env_file:
      - /opt/flask-api/app.env

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/live',
          timeout=3)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

